        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

  <div class="wrap">
    <p>SMC Montacargas · Portal interno del equipo de ventas</p>
    <p>Refacciones para montacargas</p>
  </div>
</footer>

<script>

var CONCEPTOS = [
  {
    titulo: 'Refacciones para montacargas y equipos industriales',
    categoria: 'Productos y servicios',
    descripcion: 'Piezas y repuestos (filtros, llantas, mangueras, frenos) necesarios para reparar o mantener operativos los montacargas.'
  },
  {
    titulo: 'Venta de montacargas',
    categoria: 'Productos y servicios',
    descripcion: 'Comercialización de equipos nuevos o usados (combustión, eléctricos, etc.) para clientes que buscan adquirir activos fijos para su operación.'
  },
  {
    titulo: 'Renta de equipos',
    categoria: 'Productos y servicios',
    descripcion: 'Servicio de arrendamiento de montacargas por días, meses o años. Ideal para clientes con picos de trabajo o que prefieren no invertir en compra directa.'
  },
  {
    titulo: 'Servicio y mantenimiento',
    categoria: 'Productos y servicios',
    descripcion: 'Soporte técnico especializado que incluye mantenimiento preventivo (revisiones periódicas) y correctivo (reparaciones por falla) para asegurar la operación.'
  },
  {
    titulo: 'Marcas y variedad de productos comercializados',
    categoria: 'Productos y servicios',
    descripcion: 'Catálogo de alianzas y fabricantes que maneja la empresa para ofrecer opciones originales, genéricas o multimarca según el presupuesto del cliente.'
  },
  {
    titulo: 'Cliente y prospecto',
    categoria: 'Conceptos básicos',
    descripcion: 'El prospecto es una empresa o persona con potencial de compra; el cliente es quien ya mantiene una relación comercial activa con la empresa.'
  },
  {
    titulo: 'Refacción y número de parte',
    categoria: 'Conceptos básicos',
    descripcion: 'La refacción es la pieza física de repuesto; el número de parte es el código alfanumérico único que la identifica con precisión en el catálogo.'
  },
  {
    titulo: 'Marca y modelo',
    categoria: 'Conceptos básicos',
    descripcion: 'La marca es el fabricante del equipo (ej. Toyota, EP, Caterpillar) y el modelo identifica la serie específica y sus capacidades técnicas.'
  },
  {
    titulo: 'Equivalencia',
    categoria: 'Conceptos básicos',
    descripcion: 'Pieza o refacción alternativa de otra marca o fabricante genérico que cumple exactamente con las mismas especificaciones y funciones que la original.'
  },
  {
    titulo: 'Existencia e inventario',
    categoria: 'Conceptos básicos',
    descripcion: 'La existencia es la cantidad física disponible en almacén para entrega inmediata; el inventario es el registro de todo el stock disponible y en tránsito.'
  },
  {
    titulo: 'Cotización y pedido',
    categoria: 'Conceptos básicos',
    descripcion: 'La cotización es la propuesta comercial formal de precios y condiciones; el pedido es la confirmación del cliente aceptando la compra para su procesamiento.'
  },
  {
    titulo: 'Backorder',
    categoria: 'Conceptos básicos',
    descripcion: 'Estado de un producto solicitado que actualmente no tiene stock disponible en almacén y queda pendiente de surtir en cuanto llegue del proveedor.'
  },
  {
    titulo: 'Tiempo de entrega',
    categoria: 'Conceptos básicos',
    descripcion: 'Plazo estimado (en horas, días o semanas) desde que el cliente autoriza el pedido hasta que recibe el producto o servicio en sus instalaciones.'
  },
  {
    titulo: 'Facturación y entrega',
    categoria: 'Conceptos básicos',
    descripcion: 'La facturación es la emisión del comprobante fiscal de cobro; la entrega es el acto logístico de poner el producto en manos del cliente.'
  }
];

(function () {
  var lista = document.getElementById('lista');
  var resumen = document.getElementById('resumen');
  var caja = document.getElementById('buscar');

  function norm(t) {
    return (t || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function el(tag, cls, texto) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto) e.textContent = texto;
    return e;
  }

  function dibujar() {
    var q = norm(caja.value.trim());
    var res = CONCEPTOS.filter(function (c) {
      return !q || norm(c.titulo + ' ' + (c.categoria || '') + ' ' + (c.descripcion || '')).indexOf(q) > -1;
    });

    lista.textContent = '';
    if (!CONCEPTOS.length) {
      resumen.textContent = '';
      lista.appendChild(el('p', 'empty', 'Aún no hay conceptos. Agrégalos en la lista CONCEPTOS de conceptos.html.'));
      return;
    }
    resumen.textContent = q
      ? res.length + (res.length === 1 ? ' resultado' : ' resultados') + ' para “' + caja.value.trim() + '”'
      : CONCEPTOS.length + (CONCEPTOS.length === 1 ? ' concepto' : ' conceptos');

    if (!res.length) {
      lista.appendChild(el('p', 'empty', 'No encontramos conceptos con ese nombre. Prueba con otra palabra.'));
      return;
    }

    res.forEach(function (c) {
      var card = el('article', 'concept');
      if (c.imagen) {
        var img = el('img');
        img.src = c.imagen; img.alt = c.titulo; img.loading = 'lazy';
        card.appendChild(img);
      }
      if (c.categoria) card.appendChild(el('span', 'pill', c.categoria)).style.alignSelf = 'flex-start';
      card.appendChild(el('h3', '', c.titulo));
      if (c.descripcion) card.appendChild(el('p', '', c.descripcion));
      if (c.enlace) {
        var a = el('a', 'btn', 'Ver más');
        a.href = c.enlace; a.target = '_blank'; a.rel = 'noopener';
        card.appendChild(a);
      }
      lista.appendChild(card);
    });
  }

  caja.addEventListener('input', dibujar);
  dibujar();
})();
</script>
</body>
</html>
