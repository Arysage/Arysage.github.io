        <div class="search">

<script>
/* ------------------------------------------------------------------
   AQUÍ AGREGAS TUS CONCEPTOS
   Copia un bloque { ... }, pégalo debajo (con coma al final) y cambia
   los datos. Solo "titulo" es obligatorio.

   titulo       Nombre del concepto
   categoria    (opcional) etiqueta corta, ej. 'Hidráulico'
   descripcion  (opcional) texto; puedes usar saltos de línea con \n
   imagen       (opcional) ruta de una imagen subida al repositorio,
                ej. 'conceptos/img/mastil.jpg'
   enlace       (opcional) ruta o URL de un PDF/página con más detalle,
                ej. 'conceptos/mastil.pdf'
   ------------------------------------------------------------------ */
var CONCEPTOS = [
  {
    titulo: 'Mástil',
    categoria: 'Estructura',
    descripcion: 'Estructura vertical que guía el movimiento de las horquillas para elevar y bajar la carga.'
  },
  {
    titulo: 'Placa de datos',
    categoria: 'Identificación',
    descripcion: 'Placa metálica del equipo con marca, modelo, número de serie y capacidad. Es el primer dato que se pide para cotizar una refacción.'
  },
  {
    titulo: 'Número de parte',
    categoria: 'Identificación',
    descripcion: 'Código que identifica una refacción. Puede variar entre marcas, por eso se usan tablas de equivalencias.'
  }
];

(function () {
  var lista = document.getElementById('lista');
  var resumen = document.getElementById('resumen');
  var caja = document.getElementById('buscar');

  function norm(t) {
    return (t || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function el(tag, cls, texto) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto) e.textContent = texto;
    return e;
  }

  function dibujar() {
    var q = norm(caja.value.trim());
    var res = CONCEPTOS.filter(function (c) {
      return !q || norm(c.titulo + ' ' + (c.categoria || '') + ' ' + (c.descripcion || '')).indexOf(q) > -1;
    });

    lista.textContent = '';
    if (!CONCEPTOS.length) {
      resumen.textContent = '';
      lista.appendChild(el('p', 'empty', 'Aún no hay conceptos. Agrégalos en la lista CONCEPTOS de conceptos.html.'));
      return;
    }
    resumen.textContent = q
      ? res.length + (res.length === 1 ? ' resultado' : ' resultados') + ' para “' + caja.value.trim() + '”'
      : CONCEPTOS.length + (CONCEPTOS.length === 1 ? ' concepto' : ' conceptos');

    if (!res.length) {
      lista.appendChild(el('p', 'empty', 'No encontramos conceptos con ese nombre. Prueba con otra palabra.'));
      return;
    }

    res.forEach(function (c) {
      var card = el('article', 'concept');
      if (c.imagen) {
        var img = el('img');
        img.src = c.imagen; img.alt = c.titulo; img.loading = 'lazy';
        card.appendChild(img);
      }
      if (c.categoria) card.appendChild(el('span', 'pill', c.categoria)).style.alignSelf = 'flex-start';
      card.appendChild(el('h3', '', c.titulo));
      if (c.descripcion) card.appendChild(el('p', '', c.descripcion));
      if (c.enlace) {
        var a = el('a', 'btn', 'Ver más');
        a.href = c.enlace; a.target = '_blank'; a.rel = 'noopener';
        card.appendChild(a);
      }
      lista.appendChild(card);
    });
  }

  caja.addEventListener('input', dibujar);
  dibujar();
})();
</script>
</body>
